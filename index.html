<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f0" />
    <meta name="description" content="eyesight — 供医生使用的眼球结构、常见眼病科普与互动演示。Eye anatomy and common eye condition explanations for physician-led demonstrations." />
    <title>eyesight · 眼球结构与常见眼病</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      body{margin:0}#startup-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f4f5f0;color:#253c35;font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
      #startup-screen .startup-card{width:min(100%,380px);padding:32px;box-sizing:border-box;border:1px solid #dfe4db;border-radius:16px;background:#fbfcf8;box-shadow:0 12px 48px #2346380a}
      #startup-screen .startup-brand{display:block;font-size:28px;font-weight:700;letter-spacing:-1px;color:#234638}#startup-title{margin:16px 0 8px;font-size:18px;font-weight:600}#startup-status{min-height:44px;margin:0 0 16px;color:#53654f}
      #startup-progress{display:block;width:100%;height:8px;border:0;border-radius:8px;overflow:hidden;background:#e4e9dc;accent-color:#496837}#startup-progress::-webkit-progress-bar{background:#e4e9dc}#startup-progress::-webkit-progress-value{background:#496837}#startup-progress::-moz-progress-bar{background:#496837}
      #startup-count{display:block;margin:8px 0;color:#53654f;font-size:12px;font-variant-numeric:tabular-nums}#startup-retry{display:inline-flex;align-items:center;min-height:44px;color:#234638;font-size:12px;text-underline-offset:3px}#startup-retry:focus-visible{outline:3px solid #355b29;outline-offset:3px}#startup-screen [hidden]{display:none!important}
    </style>
  </head>
  <body>
    <div id="startup-screen">
      <div class="startup-card">
        <span class="startup-brand">eyesight</span>
        <h1 id="startup-title">正在启动 · Starting eyesight</h1>
        <p id="startup-status" role="status" aria-live="polite">正在准备界面 · Preparing the interface</p>
        <progress id="startup-progress" max="4" value="0" aria-label="已完成启动步骤 · Startup steps completed">0 / 4</progress>
        <span id="startup-count" aria-hidden="true">0 / 4</span>
        <a id="startup-retry" href="">重新加载 / Reload</a>
        <noscript><p>请启用 JavaScript 后重新加载。<br />Enable JavaScript, then reload.</p></noscript>
      </div>
    </div>
    <div id="root" inert aria-busy="true"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
